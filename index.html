<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06121d">
<title>MOONAQUATICS | Premium Aquarium Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#06121d;color:#e8f5fa;line-height:1.6;overflow-x:hidden}
img,video{max-width:100%;display:block}
.glass{background:rgba(13,35,50,.92);border:1px solid rgba(74,190,220,.18);backdrop-filter:blur(12px)}
.btn{background:#06b6d4;color:#00131b;font-weight:700;border-radius:10px;padding:11px 18px}
.btn:hover{background:#22d3ee}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn2{border:1px solid #28718a;border-radius:10px;padding:10px 16px}
.field{width:100%;background:#071a28;border:1px solid #245064;border-radius:9px;padding:12px;color:white;outline:none}
.field:focus{border-color:#22d3ee}
.field:read-only{background:#102b3a;color:#9edbea}
.muted{color:#91aebd}
.product{background:#0d2231;border:1px solid #1c4052;border-radius:16px;overflow:hidden}
.product img{width:100%;height:190px;object-fit:cover;background:#102c3c}
.hidden-page{display:none!important}
.modal{position:fixed;inset:0;z-index:70;background:#000b;padding:16px;display:flex;align-items:center;justify-content:center;overflow-y:auto}
.modal-box{width:100%;max-width:650px;max-height:92vh;overflow-y:auto}
.qr-img{width:220px;height:220px;object-fit:contain;background:white;border-radius:12px;padding:8px;margin:auto}
.status{border:1px solid #245064;border-radius:20px;padding:4px 10px;font-size:12px}
table td,table th{padding:12px;vertical-align:top}
.track-line{height:4px;background:#245064;flex:1;border-radius:10px}
.track-line.done{background:#06b6d4}
.track-step{width:14px;height:14px;border-radius:50%;background:#245064;border:2px solid #3b7185;flex-shrink:0}
.track-step.done{background:#06b6d4;border-color:#67e8f9;box-shadow:0 0 10px #06b6d4}
.track-step.current{background:#22d3ee;border-color:white;box-shadow:0 0 12px #22d3ee}
</style>
</head>
